name: tests

# Runs on every pull request and on anything landing in main, so a change that
# breaks the scoring rules cannot be merged even if someone forgets to run
# pytest locally. Several tests exist specifically to catch plausible-looking
# changes that quietly break the maths -- see README, "Known gaps".
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every failing version rather than stopping at the first, so a
      # version-specific problem is obvious rather than masked.
      fail-fast: false
      matrix:
        # 3.10 is the minimum the README claims; running it here is what keeps
        # that claim honest. 3.12 covers the versions most Mac and Linux
        # collaborators will already have.
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The project itself is standard library only, so pytest is the sole
      # dependency. No credentials are needed: every test uses local fixtures,
      # and the one test that calls the odds client unsets the key first to
      # assert the error path.
      - run: python -m pip install --quiet pytest

      - run: python -m pytest tests/ -q
